name: Rename tags to a better name

on:
  push:
    branches:
      - 'lfs/action'
  schedule:
  - cron:  "30 0,12 * * *"
  workflow_dispatch:

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0
        token: ${{ secrets.GH_PAT }}
    - name: Rename tags
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch --tags https://github.com/xkbcommon/libxkbcommon
        for bad_name in $(git tag | grep ^xkbcommon-); do
          good_name=v${bad_name#xkbcommon-}
          if ! git tag | grep -q $good_name; then
            git tag $good_name $bad_name
          fi
        done
        git push --tags
