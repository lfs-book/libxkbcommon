name: Create source tarball

on:
  push:
    branches:
      - 'lfs/action'
  schedule:
  - cron:  "30 0,12 * * *"
  workflow_dispatch:

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0
    - name: Rename tags
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch --tags https://github.com/xkbcommon/libxkbcommon
        for bad_name in $(git tag | grep ^xkbcommon-); do
          good_name=v${i#xkbcommon-}
          if ! git tag | grep -q $new_tag; then
            git tag $good_name $bad_name
          fi
        done
        git push --tags
